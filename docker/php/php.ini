; Cigarholic PHP settings for the Compose runtime (the VPS pool mirrors these in infra/server/php).
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
date.timezone = UTC
expose_php = Off

; Every outgoing mail goes to Mailpit; nothing leaves the stack.
sendmail_path = "/usr/local/bin/mailpit sendmail -S mail:1025"

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Development: pick up file changes immediately. Production sets validate_timestamps=0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
