# Nginx for the Compose runtime. Document root is Bedrock's web/; PHP goes to the php service.
# The VPS vhost (infra/server/nginx) adds TLS, caching, rate limits and redirects on top of the same rules.
server {
	listen 80 default_server;
	server_name _;

	root /var/www/html/web;
	index index.php;

	client_max_body_size 64m;
	# Relative Location headers: the container listens on 80 but is published on 8080, and an absolute
	# redirect would name port 80 (nothing listens there on the host). The VPS serves on 443, the default.
	absolute_redirect off;
	charset utf-8;

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# Never serve dotfiles (except ACME challenges), Composer files or backups.
	location ~ /\.(?!well-known/) { deny all; }
	location ~* \.(sql|bak|log|lock|env)$ { deny all; }

	# XML-RPC is not used; blocked here and at the edge (OPS-03).
	location = /xmlrpc.php { return 403; }
	location = /wp/xmlrpc.php { return 403; }

	# Short admin URLs: WordPress lives in /wp/ (Bedrock); same rules as the VPS vhost.
	location = /wp-login.php { return 301 /wp$request_uri; }
	location = /wp-admin { return 301 /wp/wp-admin/$is_args$args; }
	location ~ ^/wp-admin/ { return 301 /wp$request_uri; }

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTP_PROXY "";
		fastcgi_pass php:9000;
		fastcgi_read_timeout 300;
		fastcgi_buffer_size 32k;
		fastcgi_buffers 16 16k;
	}

	location ~* \.(css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|map)$ {
		try_files $uri =404;
		expires 7d;
		access_log off;
		add_header Cache-Control "public";
	}
}
