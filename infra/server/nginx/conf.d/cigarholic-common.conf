# Shared Nginx settings for every Cigarholic site. Installed to /etc/nginx/conf.d/ by provision.sh.
# Per-site zones and server blocks are generated by site.sh from infra/server/nginx/*.tpl.

# server_tokens off is already set by Ubuntu's nginx.conf (a second one is a duplicate-directive error).
client_body_buffer_size 128k;
fastcgi_buffers 32 32k;
fastcgi_buffer_size 64k;
fastcgi_read_timeout 120s;

log_format cigarholic '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'cache=$upstream_cache_status rt=$request_time';

# gzip on is already set by Ubuntu's nginx.conf; only the tuning lives here.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/xml+rss application/rss+xml image/svg+xml font/woff2 application/manifest+json;

# ---- FastCGI cache bypass: anything personal, commerce or write-ish is never cached ------------
map $http_cookie $cigarholic_skip_cookie {
    default 0;
    ~*wordpress_logged_in_      1;
    ~*wordpress_sec_            1;
    ~*wp-postpass_              1;
    ~*comment_author            1;
    ~*woocommerce_items_in_cart 1;
    ~*woocommerce_cart_hash     1;
    ~*wp_woocommerce_session_   1;
    ~*woocommerce_recently_viewed 1;
    ~*store_notice              1;
}

map $request_uri $cigarholic_skip_uri {
    default 0;
    ~*^/(wp/)?wp-admin/         1;
    ~*^/(wp/)?wp-login\.php     1;
    ~*^/(wp/)?wp-cron\.php      1;
    ~*^/(wp/)?xmlrpc\.php       1;
    ~*^/wp-json/                1;
    ~*^/wc-api/                 1;
    ~*^/cart/                   1;
    ~*^/checkout/               1;
    ~*^/my-account/             1;
    ~*^/order-pay/              1;
    ~*^/order-received/         1;
    ~*^/feed/                   1;
    ~*sitemap(_index)?\.xml     1;
    ~*\?(.*&)?(wc-api|add-to-cart|removed_item|wc-ajax|s|preview|customize_changeset_uuid)= 1;
}

map $request_method $cigarholic_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

map "$cigarholic_skip_cookie$cigarholic_skip_uri$cigarholic_skip_method" $cigarholic_skip_cache {
    default 1;
    "000"   0;
}

# ---- Staging basic auth exceptions: `off` disables auth_basic for that request -----------------
# Server-to-server endpoints (payment webhooks, ACME) must stay reachable without credentials.
# Verified in the plugin code: Stripe listens on ?wc-api=wc_stripe, PayPal on /wp-json/paypal/v1/.
# /wp-json/wc-stripe/ and /wp-json/wc/v3/webhooks are kept open as a precaution (assumption).
map $request_uri $cigarholic_staging_auth {
    default                              "Cigarholic staging";
    ~^/\.well-known/                     off;
    ~^/wc-api/                           off;
    ~^/[^?]*\?(.*&)?wc-api=              off;
    ~^/wp-json/paypal/v1/                off;
    ~^/wp-json/wc-stripe/                off;
    ~^/wp-json/wc/v3/webhooks            off;
}
