# Security headers. Included at server level and again inside every location that sets its own
# add_header (Nginx drops inherited add_header directives in that case).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\" \"https://www.paypal.com\")" always;
add_header Strict-Transport-Security "max-age=15768000" always;
