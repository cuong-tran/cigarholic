# fail2ban filter: WordPress login attempts and xmlrpc probes in the Nginx access log.
# Bedrock serves WordPress from /wp/, so both /wp-login.php and /wp/wp-login.php are matched.
# Log format: infra/server/nginx/conf.d/cigarholic-common.conf ("cigarholic", combined plus cache/rt).
[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "POST /(?:wp/)?wp-login\.php[^"]*" (?:200|302|401|403|429)
            ^<HOST> \S+ \S+ \[\] "(?:GET|POST) /(?:wp/)?xmlrpc\.php[^"]*" \d{3}
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
