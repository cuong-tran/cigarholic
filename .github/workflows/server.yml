# Server administration as root (or a sudo user): uploads server/ and runs one of its scripts.
#
#   status     read-only health report (server/status.sh)
#   bootstrap  install and configure the server stack (server/bootstrap.sh)
#   add-site   create or update the staging or production site (server/add-site.sh)
#
# Needs secret VPS_ROOT_KEY. Remove that secret when you no longer want Actions to have root.
name: Server

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [status, bootstrap, add-site]
        default: status
      site:
        description: "add-site: which site"
        type: choice
        options: [staging, production]
        default: staging
      domain:
        description: "add-site: canonical hostname, e.g. staging.cigarholic.com"
        type: string
      alias:
        description: "add-site: optional hostname that redirects to the canonical one, e.g. www.cigarholic.com"
        type: string
      email:
        description: "add-site: WordPress admin and Let's Encrypt email"
        type: string
      harden_ssh:
        description: "bootstrap: turn off SSH password logins (only once key login works)"
        type: boolean
        default: false

concurrency:
  group: server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - name: Check server secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_ROOT_KEY: ${{ secrets.VPS_ROOT_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_ROOT_KEY" ]; then
            echo "::error::Set the VPS_HOST and VPS_ROOT_KEY secrets first. See docs/runbooks/vps-setup.md."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          user: ${{ vars.VPS_ADMIN_USER || 'root' }}
          private-key: ${{ secrets.VPS_ROOT_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Upload server scripts
        run: rsync -az --delete server/ vps:cigarholic-server/

      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          SITE_ENV: ${{ inputs.site }}
          DOMAIN: ${{ inputs.domain }}
          ALIAS: ${{ inputs.alias }}
          EMAIL: ${{ inputs.email }}
          HARDEN_SSH: ${{ inputs.harden_ssh }}
          ADMIN_USER: ${{ vars.VPS_ADMIN_USER || 'root' }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          STAGING_HTTP_AUTH: ${{ secrets.STAGING_HTTP_AUTH }}
        run: |
          sudo=()
          [ "$ADMIN_USER" = root ] || sudo=(sudo -n)

          case "$ACTION" in
            status)
              cmd=("${sudo[@]}" bash cigarholic-server/status.sh)
              ;;
            bootstrap)
              cmd=("${sudo[@]}" bash cigarholic-server/bootstrap.sh)
              [ "$HARDEN_SSH" != true ] || cmd+=(--harden-ssh)
              ;;
            add-site)
              if [ -z "$DOMAIN" ] || [ -z "$EMAIL" ]; then
                echo "::error::add-site needs the domain and email inputs"
                exit 1
              fi
              if [ "$SITE_ENV" = production ]; then site=cigarholic; else site=cigarholic-staging; fi
              cmd=("${sudo[@]}" bash cigarholic-server/add-site.sh --site "$site" --domain "$DOMAIN" --env "$SITE_ENV" --email "$EMAIL")
              [ -z "$ALIAS" ] || cmd+=(--alias "$ALIAS")
              if [ -n "$VPS_DEPLOY_KEY" ]; then
                printf '%s\n' "$VPS_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
                chmod 600 "$RUNNER_TEMP/deploy_key"
                cmd+=(--deploy-key "$(ssh-keygen -y -f "$RUNNER_TEMP/deploy_key") github-actions-deploy")
                rm -f "$RUNNER_TEMP/deploy_key"
              else
                echo "::warning::VPS_DEPLOY_KEY is not set, so the deploy workflow will not be able to log in to this site."
              fi
              if [ "$SITE_ENV" = staging ] && [ -n "$STAGING_HTTP_AUTH" ]; then
                cmd+=(--http-auth-stdin)
              fi
              ;;
          esac

          printf -v remote '%q ' "${cmd[@]}"
          # shellcheck disable=SC2029 # $remote is built and quoted on the runner on purpose
          if [[ " ${cmd[*]} " == *" --http-auth-stdin "* ]]; then
            printf '%s\n' "$STAGING_HTTP_AUTH" | ssh vps "$remote"
          else
            ssh -n vps "$remote"
          fi
