# Runs one WP-CLI command in the current release of a site (OPS-01, for agents without SSH).
# Production commands wait for the owner's approval on the `production` Environment. The command runs
# as the deploy user (never as root) with --path set to the Bedrock core directory.
#   Examples: "core is-installed", "option get blogname", "plugin list --status=active",
#             "core install --url=https://staging.cigarholic.com --title=Cigarholic --admin_user=... --admin_email=..."
name: WP-CLI

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site
        type: choice
        required: true
        default: staging
        options: [staging, production]
      command:
        description: wp subcommand and arguments (without the leading "wp")
        type: string
        required: true

concurrency:
  group: wp-cli-${{ inputs.site }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: wp ${{ inputs.command }} on ${{ inputs.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@v7

      - name: Connect
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          upload_infra: "false"

      # The owner credentials are loaded only for a command that references them (wp core install), and
      # only from secrets: a repository variable's value would be printed in this public repository's
      # logs. This step prints true/false, never a value.
      - name: Owner credentials (only for commands that use them)
        if: contains(inputs.command, 'WP_OWNER_')
        env:
          EMAIL_SECRET_SET: ${{ secrets.WP_OWNER_EMAIL != '' }}
          EMAIL_VARIABLE_SET: ${{ vars.WP_OWNER_EMAIL != '' }}
          PASSWORD_SET: ${{ secrets.WP_OWNER_INITIAL_PASSWORD != '' }}
        run: |
          set -euo pipefail
          echo "WP_OWNER_EMAIL secret: $EMAIL_SECRET_SET (variable: $EMAIL_VARIABLE_SET); WP_OWNER_INITIAL_PASSWORD secret: $PASSWORD_SET"
          if [ "$PASSWORD_SET" != true ]; then
            echo "::error::WP_OWNER_INITIAL_PASSWORD is not set: add it as a repository secret (docs/OWNER-ACTIONS.md B8)."
            exit 1
          fi
          if [ "$EMAIL_SECRET_SET" != true ]; then
            if [ "$EMAIL_VARIABLE_SET" = true ]; then
              echo "::error::WP_OWNER_EMAIL exists only as a repository variable, whose value would be printed in this public log. Add a repository secret named WP_OWNER_EMAIL with the same value, then delete the variable (docs/OWNER-ACTIONS.md B8)."
            else
              echo "::error::WP_OWNER_EMAIL is not set: add it as a repository secret (docs/OWNER-ACTIONS.md B8)."
            fi
            exit 1
          fi

      - name: Run
        env:
          SITE: ${{ inputs.site }}
          COMMAND: ${{ inputs.command }}
          WP_OWNER_EMAIL: ${{ contains(inputs.command, 'WP_OWNER_') && secrets.WP_OWNER_EMAIL || '' }}
          WP_OWNER_INITIAL_PASSWORD: ${{ contains(inputs.command, 'WP_OWNER_') && secrets.WP_OWNER_INITIAL_PASSWORD || '' }}
        run: |
          set -euo pipefail
          case "$COMMAND" in *$'\n'*) echo "::error::one command per run"; exit 1 ;; esac
          # The command goes through stdin, so no quoting of the owner's input happens on a command line.
          # $WP_OWNER_EMAIL and $WP_OWNER_INITIAL_PASSWORD may be referenced in the command (wp core install).
          {
            printf 'export WP_OWNER_EMAIL=%q WP_OWNER_INITIAL_PASSWORD=%q\n' "$WP_OWNER_EMAIL" "$WP_OWNER_INITIAL_PASSWORD"
            printf 'cd /var/www/%s/current && wp --path=web/wp %s\n' "$SITE" "$COMMAND"
          } > /tmp/wp-cmd.sh
          if [ "$SSH_RUN_USER" = root ]; then
            ssh cigarholic-vps 'sudo -n -u deploy -H bash -s' < /tmp/wp-cmd.sh
          else
            ssh cigarholic-vps 'bash -s' < /tmp/wp-cmd.sh
          fi
