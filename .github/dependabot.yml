# Dependency update PRs (FND-13, brought forward for security releases per ADR 0001: WordPress core
# and plugins are Composer-managed, so point releases arrive here as PRs, run CI, deploy to staging
# on merge and reach production with the next approved tag).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "composer"]
    groups:
      wordpress-core:
        patterns: ["roots/wordpress*"]
      woocommerce-and-plugins:
        patterns: ["wpackagist-plugin/*"]
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "npm"]
    groups:
      npm-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "github-actions"]
